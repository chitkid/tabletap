<!--
  Little Furnace wordmark — the M1 brand guidelines' SVG logo, delivered in M6.
  Per docs/brand-guidelines.md §3: "Little Furnace" set in Bricolage Grotesque 700,
  tracking -0.02em, sentence-cased, and nothing else — no flame, no furnace, no chef
  hat, no icon mark beside it.

  The letterforms are outlined paths (glyph outlines from the actual variable font,
  instanced at wght=700 opsz=14 wdth=100 — the font's own "Bold" instance — and
  shaped with HarfBuzz for correct advances and tracking), not live text, so the
  file renders correctly with no font installed and cannot be re-set in a different
  face by accident. The path takes currentColor and the root <svg> sets color="#1C1917"
  (Ink, the guidelines' single-colour-context value), so the file renders Ink when
  opened on its own with no CSS context and inherits whatever colour a consumer sets
  otherwise — one asset can serve all four approved colour pairings in the table
  above. The viewBox is a tight crop of the ink; the guidelines' own clear-space rule
  (the cap height of the L, on all four sides) is for whoever places this mark, not
  baked into the file.

  This is the restaurant's wordmark, not TableTap's. It never shares a lockup with
  the TableTap mark (packages/ui/src/components/mark.tsx) — see brand-guidelines.md §3.
-->
