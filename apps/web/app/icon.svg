<!--
  TableTap's favicon: the same geometry as packages/ui/src/components/mark.tsx, with
  the two colours resolved to their literal values, because a favicon has no CSS
  context to resolve currentColor or var(--primary) against. Ring: Ink #1C1917
  (--foreground, light theme). Dot: Ember #C23E18 (--primary, light theme). Not
  scanned by scripts/validate-tokens.cjs — it only scans .ts/.tsx/.js/.jsx/.css/.scss
  files, and this is the one place a literal colour is correct rather than a bug.

  If the ring or dot geometry in mark.tsx ever changes, change it here too.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <circle
    cx="32"
    cy="32"
    r="22"
    fill="none"
    stroke="#1C1917"
    stroke-width="7"
    stroke-linecap="round"
    stroke-dasharray="110 28"
    transform="rotate(28 32 32)"
  />
  <circle cx="32" cy="32" r="8.5" fill="#C23E18" />
</svg>
