name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec prettier --check .
      - run: pnpm typecheck
      - run: pnpm tokens && git diff --exit-code -- packages/ui/tokens.css
      # The brand document is upstream of the token source: rerunning the sync must be a no-op.
      - run: pnpm brand:sync && git diff --exit-code -- assets/design-tokens.json packages/ui/tokens.css
      - run: pnpm validate-tokens
      - run: pnpm test

  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - run: curl -fsS http://localhost:4000/health
      # The web container has no healthcheck, so `--wait` returns as soon as it is running.
      - run: curl -fsS --retry 20 --retry-delay 3 --retry-all-errors -o /dev/null http://localhost:3000/login
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm lighthouse --base http://localhost:3000 --min-a11y 95
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: docs/lighthouse-results.json
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
