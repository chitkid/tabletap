name: vercel-check

# Ask Vercel what the stored credentials can actually see, and print the answer.
#
# `vercel pull` fails with one sentence - `Could not retrieve Project Settings` - for at least
# five different reasons: a project id from another account, an id that is a project *name* rather
# than a `prj_…`, a revoked token, a token that cannot read the team at all, and - the one that
# cost this repository four deploy attempts - a token scoped to a single PROJECT, which reads the
# project and not the team it belongs to. The workflow's own configuration gate cannot tell them
# apart, because to it all five look identical: every value present and non-empty.
#
# Question 4 was added after the fact, and its absence is why the first version of this file was
# reassuring rather than useful: it asked `/v2/teams` - list every team - and a 403 there IS what a
# team-scoped token answers by design, so the answer was read as healthy. The CLI asks
# `/teams/<id>` - read THIS team - and that 403 is fatal. Two questions one word apart, and only
# one of them was the one the failure turned on.
#
# This asks the three questions separately so the answer names the cause. It prints status codes,
# the token's own account, the teams it can see and whether the project id resolves - never the
# token, which stays in the secret store and is only ever an Authorization header here.

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: What the token is, and what it can reach
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -eu
          auth="authorization: Bearer ${VERCEL_TOKEN}"

          # The shapes of the two ids, without printing them. A project id is `prj_` + 24, a team
          # id `team_` + 24; a name typed into the wrong box fails here rather than three steps
          # later with a sentence about project settings.
          case "${VERCEL_PROJECT_ID}" in
            prj_*) echo "VERCEL_PROJECT_ID looks like a project id (prj_…, ${#VERCEL_PROJECT_ID} chars)" ;;
            *) echo "VERCEL_PROJECT_ID does NOT start with prj_ - it is ${#VERCEL_PROJECT_ID} characters. A project NAME here is the usual cause." ;;
          esac
          case "${VERCEL_ORG_ID}" in
            team_*) echo "VERCEL_ORG_ID looks like a team id (team_…, ${#VERCEL_ORG_ID} chars)" ;;
            *) echo "VERCEL_ORG_ID does NOT start with team_ - it is ${#VERCEL_ORG_ID} characters. A personal account id is fine here only if the project is personal." ;;
          esac

          echo
          echo "== 1. Who does this token belong to? (GET /v2/user)"
          code=$(curl -s -o /tmp/user.json -w '%{http_code}' -H "${auth}" https://api.vercel.com/v2/user || echo 000)
          echo "HTTP ${code}"
          if [ "${code}" = "200" ]; then
            jq -r '"account: " + (.user.username // .user.email // "?")' /tmp/user.json
          else
            # 403 here means the token is revoked, expired, or was never valid.
            jq -r '.error.code + ": " + .error.message' /tmp/user.json 2>/dev/null || cat /tmp/user.json
          fi

          echo
          echo "== 2. Which teams can it see? (GET /v2/teams)"
          code=$(curl -s -o /tmp/teams.json -w '%{http_code}' -H "${auth}" https://api.vercel.com/v2/teams || echo 000)
          echo "HTTP ${code}"
          if [ "${code}" = "200" ]; then
            jq -r '.teams[] | "  team: " + .id + "  (" + (.slug // .name // "?") + ")"' /tmp/teams.json
            if jq -e --arg id "${VERCEL_ORG_ID}" '.teams[] | select(.id == $id)' /tmp/teams.json > /dev/null; then
              echo "  -> VERCEL_ORG_ID is in that list."
            else
              echo "  -> VERCEL_ORG_ID is NOT in that list. This is the token-scope case: create a token scoped to that team."
            fi
          else
            jq -r '.error.code + ": " + .error.message' /tmp/teams.json 2>/dev/null || cat /tmp/teams.json
          fi

          echo
          echo "== 3. Does the project resolve? (GET /v9/projects/<id>?teamId=<id>)"
          code=$(curl -s -o /tmp/project.json -w '%{http_code}' -H "${auth}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" || echo 000)
          echo "HTTP ${code}"
          if [ "${code}" = "200" ]; then
            jq -r '"  project: " + .name + "  (" + .id + ")"' /tmp/project.json
            echo "  -> All three agree. If 'vercel pull' still fails, the cause is in the CLI step, not the credentials."
          else
            jq -r '"  " + .error.code + ": " + .error.message' /tmp/project.json 2>/dev/null || cat /tmp/project.json
          fi

          echo
          echo "== 4. Can it read THAT team? (GET /teams/<id>)  <- the one the CLI needs"
          code=$(curl -s -o /tmp/team.json -w '%{http_code}' -H "${auth}"             "https://api.vercel.com/v2/teams/${VERCEL_ORG_ID}" || echo 000)
          echo "HTTP ${code}"
          if [ "${code}" = "200" ]; then
            jq -r '"  team: " + (.slug // .name // "?")' /tmp/team.json
            echo "  -> vercel pull can link. This is the question that decides it."
          else
            jq -r '"  " + .error.code + ": " + .error.message' /tmp/team.json 2>/dev/null || cat /tmp/team.json
            echo "  -> THIS is what fails the deploy. A token scoped to a single PROJECT reads the"
            echo "     project (3 passes) and not the team it belongs to, and the CLI needs both."
            echo "     Create a token whose scope is the TEAM, not a project."
          fi

          echo
          echo "Read them together. 3 and 4 are the pair that matters and they are not the same"
          echo "question: the CLI resolves a link by reading the project AND the team. A 404 at 1"
          echo "and a 403 at 2 are what a team-scoped token answers by design - listing every team"
          echo "is not something it may do - so neither of those is a fault on its own. 4 is."
