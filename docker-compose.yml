services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tabletap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tabletap}
      POSTGRES_DB: ${POSTGRES_DB:-tabletap}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tabletap} -d ${POSTGRES_DB:-tabletap}']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Pinned, like postgres above: untagged is `:latest`, so CI and every fresh `compose up` would
    # pull a moving target, and the demo stack being reproducible is part of what this repository
    # is showing. `mc anonymous` in particular has changed shape upstream before, and it is what
    # opens the menu/ prefix below.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-tabletap}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-tabletap-secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local']
      interval: 5s
      timeout: 3s
      retries: 20

  # One shot: creates the bucket and opens the menu/ prefix - and only that prefix - to anonymous
  # readers, because a menu photograph is served straight to a guest's browser with no session.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: 'no'
    environment:
      S3_BUCKET: ${S3_BUCKET:-tabletap}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-tabletap}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-tabletap-secret}
    entrypoint:
      - /bin/sh
      - -c
      - >
        set -e;
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY";
        mc mb --ignore-existing "local/$$S3_BUCKET";
        mc anonymous set download "local/$$S3_BUCKET/menu/";
        mc anonymous get "local/$$S3_BUCKET/menu/"
    depends_on:
      minio:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tabletap}:${POSTGRES_PASSWORD:-tabletap}@postgres:5432/${POSTGRES_DB:-tabletap}
      PORT: 4000
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_MODE: ${DEMO_MODE:-true}
      # Three views of one MinIO. S3_ENDPOINT is how the API itself dials it, on the compose
      # network. S3_PRESIGN_ENDPOINT is the origin an upload URL is *signed* for: SigV4 covers the
      # Host header, so a URL signed for minio:9000 is refused when a browser on the host uses it.
      # S3_PUBLIC_URL is where a guest's browser reads the finished photograph from.
      S3_ENDPOINT: http://minio:9000
      S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-tabletap}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-tabletap}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-tabletap-secret}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/${S3_BUCKET:-tabletap}}
      S3_FORCE_PATH_STYLE: 'true'
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        API_URL: http://api:4000
        NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-http://localhost:4000}
        # NEXT_PUBLIC_* is inlined at build time, so this has to be a build arg too, not only the
        # runtime value below. Without it, the two routes Next prerenders at build time
        # (/session-ended, /_not-found) always bake in http://localhost:3000 regardless of what
        # environment: sets — a real defect this repository shipped until this line was added.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        # Client-only (apps/web/components/admin/photo-field.tsx), so it needs a build arg and
        # nothing under environment: below — unlike NEXT_PUBLIC_APP_URL, no server code reads it.
        NEXT_PUBLIC_UPLOADS_ENABLED: ${NEXT_PUBLIC_UPLOADS_ENABLED:-true}
    environment:
      # Still needed at runtime alongside the build arg above: dynamically rendered routes read
      # process.env.NEXT_PUBLIC_APP_URL again when their module loads, the same way
      # next.config.ts re-reads API_URL — only the two build-time-prerendered routes depend on
      # the build arg alone.
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  minio-data:
