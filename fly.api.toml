# tabletap-api - Fly app configuration. Deployed by .github/workflows/deploy.yml, and by hand for
# the very first deploy (docs/deploy.md). Region and topology: spec section 4.1.
app = 'tabletap-api'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile.api'

# Non-secret configuration only. Real secrets (BETTER_AUTH_SECRET, COOKIE_SECRET,
# TABLE_TOKEN_SECRET, SOCKET_TOKEN_SECRET, DEMO_PASSWORD, the S3_* credentials, DATABASE_URL) are
# never written here - they go in with `fly secrets set`, per docs/deploy.md, and never reach this
# file or the git history it lives in.
[env]
  # Public address of the web app - CORS and better-auth's origin check (spec section 4.2).
  WEB_ORIGIN = 'https://tabletap-web.fly.dev'
  # This API's own public address - better-auth's cookie prefix and callback base.
  BETTER_AUTH_URL = 'https://tabletap-api.fly.dev'
  # Portfolio demo: exposes GET /api/demo/links and resets the seed on an interval, and resets once
  # more on every boot so a machine Fly stopped while idle does not wake up mid-mess (spec 4.4).
  DEMO_MODE = 'true'
  # The public demo refuses new photo uploads while leaving every other admin action alone: an
  # uploaded object survives the hourly reset and sits on storage the owner pays for. This is the
  # control the API enforces; NEXT_PUBLIC_UPLOADS_ENABLED in fly.web.toml is only the web's
  # matching explanation of the same decision (apps/api/src/config.ts, apps/web/components/admin/photo-field.tsx).
  DEMO_UPLOADS_ENABLED = 'false'
  # Left at its code default (apps/api/src/config.ts), spelled out here because spec 4.5 depends on
  # it and a reader should not have to go find the default to know what is trusted. `uniquelocal`
  # covers fc00::/7, which is where fly-proxy's own fdaa:: address lives - the one property the
  # rate limiter's per-visitor bucketing rests on (apps/api/src/lib/client-key.ts). `loopback` is
  # what the local Docker Compose demo needs, and this value works unchanged in both places.
  TRUST_PROXY = 'loopback,uniquelocal'

# The explicit [[services]] form, not the [http_service] shorthand - deliberately. This app is
# both public (the browser's WebSocket dials it directly, fly.web.toml's NEXT_PUBLIC_API_ORIGIN)
# and privately reachable over its .flycast address (fly.web.toml's API_URL, for the rewrite).
# Both fronts share this one service definition; only [[services.ports]] lets the two ports that
# definition exposes disagree on `force_https`, which they must: Fly's own Flycast documentation
# says plainly not to set `force_https` for a flycast-reachable service, because Flycast is
# HTTP-only - a flycast request to port 80 that got redirected to :443 would be redirected into a
# TLS handshake flycast cannot perform (there is no certificate for a private hostname). The
# [http_service] shorthand ties `force_https` to the whole service, which is exactly what broke
# this the first time: `force_https = true` there redirects a flycast caller into that same dead
# end, silently, since nothing in a manual test would notice until the private route actually
# needed to carry real traffic.
[[services]]
  internal_port = 4000
  protocol = 'tcp'
  # Stopped when idle, started on the next request, one machine: a demo nobody pays to keep warm
  # (spec 4.1). The first request after a quiet spell is slower; that cost is accepted, and the
  # demo reset running on every boot (spec 4.4) is what keeps a wake from showing a stale mess.
  # These three settings work identically here as they did under [http_service] - Fly documents
  # autostop/autostart/min_machines_running as available to either form.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ['http']
    # Deliberately no `force_https` on this port. Flycast traffic (fly.web.toml's API_URL) arrives
    # here, over the private network, and cannot be redirected to TLS - see the block comment
    # above. The cost: a public caller who connects in plain HTTP on :80 is served in plain HTTP
    # rather than redirected to :443. Nothing in this deployment actually does that - the browser's
    # WebSocket is built from NEXT_PUBLIC_API_ORIGIN, which is hardcoded to `https://...`
    # (fly.web.toml), so no real client here ever issues a plain-http request to this app at all.
    # The redirect this gives up is pure defense-in-depth against a caller nobody in this
    # deployment produces, not a protection anything here actually relies on.

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  # Observability, not a release gate: .github/workflows/deploy.yml deploys with
  # `--strategy immediate` (one machine, so there is no second machine to roll onto), which does
  # not wait on health checks before finishing. The workflow's own curl smoke check after the
  # deploy is what actually gates the job.
  [[services.http_checks]]
    grace_period = '30s'
    interval = '15s'
    timeout = '5s'
    method = 'get'
    path = '/health'
